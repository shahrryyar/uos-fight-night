<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <!-- C1 lockdown: this shell is deliberately neutral (no league name, logo, og/twitter tags,
         manifest or brand preloads) because crawlers, link previews and view-source never run JS.
         The branded title, description, icons and manifest are added by
         src/components/lockdown/brandHead.ts once public_site_status() says this viewer is not locked out. -->
    <title data-shell>Members</title>
    <meta name="description" content="Members only." />
    <link rel="icon" type="image/svg+xml" data-shell href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%2371717a%22%2F%3E%3C%2Fsvg%3E" />

    <!-- type: Big Shoulders (display), Archivo (UI), Courier Prime (data). Arabic faces load only on demand (unicode-range). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Big+Shoulders:opsz,wght@10..72,800;10..72,900&family=Courier+Prime:wght@400;700&family=Noto+Kufi+Arabic:wght@700&family=Noto+Sans+Arabic:wght@400;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
